<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pannello Admin — ReadYourMood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="page-header-rym">
        <div class="container"><h1>⚙️ Pannello Amministratore</h1></div>
    </div>
    <div class="container flex-grow-1 pb-4">
        <h4 style="color:var(--malva)" class="mb-3">👥 Gestione Utenti</h4>
        <table class="table table-rym mb-5">
            <thead>
                <tr><th>Nome</th><th>Email</th><th>Stato</th><th>Azioni</th></tr>
            </thead>
            <tbody>
                <tr th:each="utente : ${utenti}">
                    <td th:text="${utente.nome + ' ' + utente.cognome}"></td>
                    <td th:text="${utente.email}"></td>
                    <td>
                        <span class="badge-disponibile" th:if="${utente.stato.name() == 'ATTIVO'}">Attivo</span>
                        <span class="badge-venduto" th:if="${utente.stato.name() == 'BLOCCATO'}">Bloccato</span>
                    </td>
                    <td>
                        <a th:href="@{/admin/utenti/{id}/toggle(id=${utente.id})}"
                           th:text="${utente.stato.name() == 'ATTIVO'} ? '🔒 Blocca' : '🔓 Sblocca'"
                           class="btn btn-sm btn-rym"></a>
                        <a th:href="@{/venditori/{id}(id=${utente.id})}"
                           class="btn btn-sm btn-rym-outline ms-1">Profilo</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="mt-3">
            <form action="/logout" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-danger">⏻ Logout</button>
            </form>
        </div>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
