<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pannello Admin — TorneoGoal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="page-header">
        <div class="container">
            <h1>⚙️ Pannello Amministratore</h1>
        </div>
    </div>
    <div class="container flex-grow-1 pb-4">
        <div class="row g-4 mt-2">
            <div class="col-md-3">
                <div class="detail-card">
                    <div class="detail-card-header" style="background:var(--arancio)">
                        <h5 class="mb-0">🏆 Tornei</h5>
                    </div>
                    <div class="detail-card-body d-flex gap-2">
                        <a href="/tornei" class="btn btn-outline-secondary flex-fill">Vedi lista</a>
                        <a href="/admin/tornei/new" class="btn btn-save flex-fill">Nuovo</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="detail-card">
                    <div class="detail-card-header" style="background:#68BA7F">
                        <h5 class="mb-0">👥 Squadre</h5>
                    </div>
                    <div class="detail-card-body d-flex gap-2">
                        <a href="/squadre" class="btn btn-outline-secondary flex-fill">Vedi lista</a>
                        <a href="/admin/squadre/new" class="btn btn-save flex-fill">Nuova</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="detail-card">
                    <div class="detail-card-header" style="background:var(--oro)">
                        <h5 class="mb-0">📅 Partite</h5>
                    </div>
                    <div class="detail-card-body d-flex gap-2">
                        <a href="/partite" class="btn btn-outline-secondary flex-fill">Vedi lista</a>
                        <a href="/admin/partite/new" class="btn btn-save flex-fill">Nuova</a>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="detail-card">
                    <div class="detail-card-header" style="background:var(--bordeaux)">
                        <h5 class="mb-0">⚽ Giocatori</h5>
                    </div>
                    <div class="detail-card-body d-flex gap-2">
                        <a href="/giocatori" class="btn btn-outline-secondary flex-fill">Vedi lista</a>
                        <a href="/admin/giocatori/new" class="btn btn-save flex-fill">Nuovo</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <form action="/logout" method="post" class="d-inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-danger">⏻ Logout</button>
            </form>
        </div>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
