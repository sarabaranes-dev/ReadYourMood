<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pagamento Sicuro — ReadYourMood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    
    <div class="container flex-grow-1 py-5" style="max-width: 900px;">
        <h2 class="mb-4 text-center" style="color:var(--malva)">🔒 Cassa e Pagamento</h2>
        
        <div class="row g-5">
            <div class="col-md-5 order-md-2">
                <h4 class="d-flex justify-content-between align-items-center mb-3">
                    <span style="color:var(--malva);">Riepilogo Ordine</span>
                    <span class="badge rounded-pill" style="background-color: var(--rosa);" th:text="${libriScelti.size()}"></span>
                </h4>
                <ul class="list-group mb-3 shadow-sm">
                    <li class="list-group-item d-flex justify-content-between lh-sm p-3" th:each="libro : ${libriScelti}">
                        <div>
                            <h6 class="my-0" style="color:var(--testo); font-weight:bold;" th:text="${libro.titolo}"></h6>
                            <small class="text-muted" th:text="${libro.autore}"></small>
                        </div>
                        <span class="text-muted" th:text="'€ ' + ${#numbers.formatDecimal(libro.prezzo, 1, 2)}"></span>
                    </li>
                    
                    <li class="list-group-item d-flex justify-content-between p-3" style="background-color: var(--menta-chiaro);">
                        <span style="color:#2a7a5a; font-weight:bold;">Totale (EUR)</span>
                        <strong style="color:#2a7a5a; font-size:1.1rem;" th:text="'€ ' + ${#numbers.formatDecimal(totale, 1, 2)}"></strong>
                    </li>
                </ul>
            </div>

            <div class="col-md-7 order-md-1">
                <div class="detail-card-rym p-4 shadow-sm">
                    <form action="/ordini/conferma" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        
                        <th:block th:each="id : ${libriIds}">
                            <input type="hidden" name="libriIds" th:value="${id}"/>
                        </th:block>
                        
                        <h5 class="mb-3 border-bottom pb-2" style="color:var(--malva);">Indirizzo di Spedizione</h5>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Nome e Cognome</label>
                            <input type="text" class="form-control" required/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Indirizzo Completo</label>
                            <input type="text" class="form-control" placeholder="Via, Numero, Città, CAP..." required/>
                        </div>

                        <h5 class="mb-3 border-bottom pb-2" style="color:var(--malva);">Metodo di Pagamento</h5>
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Numero Carta</label>
                            <input type="text" class="form-control" placeholder="1234 5678 9101 1121" maxlength="19" required/>
                        </div>
                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <label class="form-label small fw-bold">Scadenza (MM/AA)</label>
                                <input type="text" class="form-control" placeholder="12/28" maxlength="5" required/>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold">CVC</label>
                                <input type="text" class="form-control" placeholder="123" maxlength="3" required/>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-rym w-100 py-3 mt-2" style="font-size: 1.1rem; letter-spacing: 0.5px;">
                            Paga <span th:text="'€ ' + ${#numbers.formatDecimal(totale, 1, 2)}"></span> ora
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
