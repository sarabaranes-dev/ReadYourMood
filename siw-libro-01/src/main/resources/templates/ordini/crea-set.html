<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Crea Set — ReadYourMood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="page-header-rym">
        <div class="container">
            <h1>📦 Crea Set</h1>
            <p class="mb-0" style="color:#F0D8E0"
               th:text="'Libri di ' + ${venditore.nome + ' ' + venditore.cognome}"></p>
        </div>
    </div>
    <div class="container flex-grow-1 pb-4">
        <div class="form-card-rym">
            <p class="text-muted">Seleziona i libri che vuoi acquistare insieme dallo stesso venditore. Il totale verrà calcolato automaticamente.</p>
            <form action="/ordini/crea-set" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="row g-3 mb-4">
                    <div class="col-6 col-md-3" th:each="libro : ${libriVenditore}">
                        <label class="d-block cursor-pointer">
                            <input type="checkbox" name="libriIds" th:value="${libro.id}"
                                   style="display:none" class="libro-check"/>
                            <div class="libro-card libro-selezionabile">
                                <div class="libro-card-cover">
                                    <img th:if="${libro.foto != null}" th:src="@{/uploads/{f}(f=${libro.foto})}" alt="copertina"/>
                                    <span th:if="${libro.foto == null}">📖</span>
                                </div>
                                <div class="libro-card-body">
                                    <div class="libro-card-titolo" th:text="${libro.titolo}"></div>
                                    <div class="libro-card-prezzo" th:text="'€ ' + ${#numbers.formatDecimal(libro.prezzo, 1, 2)}"></div>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <strong>Totale stimato: </strong>
                        <span id="totaleSet" style="color:var(--malva);font-weight:bold">€ 0.00</span>
                    </div>
                    <button type="submit" class="btn btn-rym">🛒 Acquista Set</button>
                </div>
            </form>
        </div>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <style>
        .libro-selezionabile { cursor: pointer; border: 2px solid transparent; transition: border 0.2s; }
        .libro-selezionabile.selected { border-color: var(--rosa); }
    </style>
    <script>
        document.querySelectorAll('.libro-check').forEach(check => {
            const prezzoText = check.closest('label').querySelector('.libro-card-prezzo').textContent;
            const prezzo = parseFloat(prezzoText.replace('€ ', '').replace(',', '.'));
            check.addEventListener('change', () => {
                check.closest('label').querySelector('.libro-selezionabile')
                    .classList.toggle('selected', check.checked);
                let totale = 0;
                document.querySelectorAll('.libro-check:checked').forEach(c => {
                    const p = parseFloat(c.closest('label').querySelector('.libro-card-prezzo')
                        .textContent.replace('€ ', '').replace(',', '.'));
                    totale += p;
                });
                document.getElementById('totaleSet').textContent = '€ ' + totale.toFixed(2);
            });
        });
    </script>
</body>
</html>
