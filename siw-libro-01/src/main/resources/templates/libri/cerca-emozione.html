<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cerca per Emozione — ReadYourMood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="page-header-rym">
        <div class="container">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-1">
                    <li class="breadcrumb-item"><a href="/" style="color:#F0D8E0">Home</a></li>
                    <li class="breadcrumb-item active">Cerca per emozione</li>
                </ol>
            </nav>
            <h1>🎭 Come ti senti oggi?</h1>
            <p class="mb-0" style="color:#F0D8E0">Scegli la tua emozione e scopri il libro perfetto per te</p>
        </div>
    </div>
    <div class="container flex-grow-1 pb-4">

        <!-- Filtro client-side -->
        <div class="search-bar-rym mb-4">
            <div class="input-group" style="max-width:400px">
                <input type="text" id="filtroEmozione" class="form-control"
                       placeholder="Filtra emozioni... es. FELICE"/>
                <button onclick="document.getElementById('filtroEmozione').value='';filtraEmozioni()"
                        class="btn btn-outline-secondary">Reset</button>
            </div>
        </div>

        <!-- Griglia emozioni -->
        <div class="emotion-grid" id="emotionGrid">
            <a th:each="emozione : ${emozioni}"
               th:href="@{/libri(emozione=${emozione.name()})}"
               th:data-nome="${emozione.name()}"
               th:classappend="${'ec-' + emozione.name().toLowerCase()}"
               class="emotion-card">
                <span th:switch="${emozione.name()}">
                    <span th:case="'FELICE'">😊</span>
                    <span th:case="'TRISTE'">😢</span>
                    <span th:case="'INNAMORATO'">❤️</span>
                    <span th:case="'RIFLESSIVO'">🤔</span>
                    <span th:case="'ANSIOSO'">😰</span>
                    <span th:case="'NOSTALGICO'">🌅</span>
                    <span th:case="'ARRABBIATO'">😠</span>
                    <span th:case="'SPAVENTATO'">😨</span>
                    <span th:case="*">🎭</span>
                </span>
                <p th:text="${emozione.name()}"></p>
            </a>
        </div>

        <p id="nessunRisultato" style="display:none;color:#888;text-align:center;margin-top:2rem">
            Nessuna emozione trovata.
        </p>
    </div>
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        function filtraEmozioni() {
            const query = document.getElementById('filtroEmozione').value.toUpperCase().trim();
            const cards = document.querySelectorAll('#emotionGrid .emotion-card');
            let visibili = 0;
            cards.forEach(card => {
                const nome = card.getAttribute('data-nome');
                if (nome.includes(query)) {
                    card.style.display = 'block';
                    visibili++;
                } else {
                    card.style.display = 'none';
                }
            });
            document.getElementById('nessunRisultato').style.display =
                visibili === 0 ? 'block' : 'none';
        }

        document.getElementById('filtroEmozione')
            .addEventListener('input', filtraEmozioni);
    </script>
</body>
</html>
