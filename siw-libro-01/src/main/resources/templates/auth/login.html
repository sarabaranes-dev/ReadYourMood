<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Accedi — ReadYourMood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100" style="background:var(--malva)">
    <div class="d-flex align-items-center justify-content-center flex-grow-1 py-5">
        <div class="form-card-rym" style="max-width:420px;width:100%">
            <div class="text-center mb-4">
                <a href="/" class="logo-rym" style="color:var(--malva)">
                    Read<span class="logo-accent" style="color:var(--rosa)">Your</span>Mood 📚
                </a>
                <h5 class="mt-3 mb-0" style="color:var(--malva)">Bentornato!</h5>
            </div>
            
            <div th:if="${param.bloccato}" class="alert alert-danger text-center" style="border-radius:8px">
                <strong>Accesso negato.</strong> Il tuo account è stato bloccato dall'amministratore.
            </div>

            <div th:if="${param.error}" class="alert" style="background:var(--rosa-chiaro);color:var(--malva);border-radius:8px">
                Username o password errati.
            </div>
            
            <form action="/login" method="post">
                <div class="mb-3">
                    <label class="form-label fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" required/>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" required/>
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-rym w-100 py-2">Accedi</button>
            </form>
            <hr/>
            <p class="text-center mb-0">Non hai un account?
                <a href="/register" style="color:var(--rosa)">Registrati</a>
            </p>
            <p class="text-center mt-2">
                <a href="/" style="color:#999;font-size:0.9rem">← Torna alla home</a>
            </p>
        </div>
    </div>
</body>
</html>
