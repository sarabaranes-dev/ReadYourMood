<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrati — ReadYourMood</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100" style="background:var(--malva)">
    <div class="d-flex align-items-center justify-content-center flex-grow-1 py-5">
        <div class="form-card-rym" style="max-width:480px;width:100%">
            <div class="text-center mb-4">
                <a href="/" class="logo-rym" style="color:var(--malva)">
                    Read<span style="color:var(--rosa)">Your</span>Mood 📚
                </a>
                <h5 class="mt-3 mb-0" style="color:var(--malva)">Crea il tuo account</h5>
            </div>
            <form action="/register" method="post" th:object="${utente}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Nome</label>
                        <input type="text" class="form-control" th:field="*{nome}" required/>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Cognome</label>
                        <input type="text" class="form-control" th:field="*{cognome}" required/>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold">Email</label>
                    <input type="email" class="form-control" th:field="*{email}" required/>
                </div>
                <hr/>
                <div class="mb-3">
                    <label class="form-label fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" required/>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" name="password" class="form-control" required/>
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-rym w-100 py-2">Registrati</button>
            </form>
            <hr/>
            <p class="text-center mb-0">Hai già un account?
                <a href="/login" style="color:var(--rosa)">Accedi</a>
            </p>
        </div>
    </div>
</body>
</html>
