<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registrati — TorneoGoal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
</head>
<body class="d-flex flex-column min-vh-100" style="background:var(--verde-scuro)">
    <div class="d-flex align-items-center justify-content-center flex-grow-1 py-5">
        <div class="form-card" style="max-width:420px;width:100%">
            <div class="text-center mb-4">
                <a href="/" class="logo-text" style="color:var(--verde-scuro)">
                    T<span class="logo-ball">⚽</span>rne<span class="logo-ball">⚽</span>G<span class="logo-ball">⚽</span>al
                </a>
                <h4 class="mt-3 mb-0" style="color:var(--verde-scuro)">Crea il tuo account</h4>
            </div>
            <form action="/register" method="post">
                <div class="mb-3">
                    <label class="form-label fw-500">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Scegli un username" required/>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-500">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Scegli una password" required/>
                </div>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-save w-100 py-2">Registrati</button>
            </form>
            <hr/>
            <p class="text-center mb-0">Hai già un account? <a href="/login" style="color:var(--verde-medio)">Accedi</a></p>
        </div>
    </div>
</body>
</html>
