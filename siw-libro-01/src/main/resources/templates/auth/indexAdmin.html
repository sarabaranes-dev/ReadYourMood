<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Pannello Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="container mt-5">
    <h1>Pannello Amministratore</h1>
    <p>Benvenuto nel pannello di gestione.</p>

    <div class="row mt-4">
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Tornei</h5>
                    <a href="/tornei" class="btn btn-outline-primary me-2">Vedi lista</a>
                    <a href="/admin/tornei/new" class="btn btn-primary">Nuovo</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Squadre</h5>
                    <a href="/squadre" class="btn btn-outline-primary me-2">Vedi lista</a>
                    <a href="/admin/squadre/new" class="btn btn-primary">Nuova</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Partite</h5>
                    <a href="/partite" class="btn btn-outline-primary me-2">Vedi lista</a>
                    <a href="/admin/partite/new" class="btn btn-primary">Nuova</a>
                </div>
            </div>
        </div>
        <div class="col-md-4 mb-3">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Giocatori</h5>
                    <a href="/admin/giocatori/new" class="btn btn-primary">Nuovo</a>
                </div>
            </div>
        </div>
    </div>

    <form action="/logout" method="post" class="mt-3">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit" class="btn btn-danger">Logout</button>
    </form>
</div>
</body>
</html>
