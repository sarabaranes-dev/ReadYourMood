<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar-rym">
    <a href="/" class="logo-rym">Read<span class="logo-accent">Your</span>Mood 📚</a>
    <div class="d-flex gap-1">
        <a sec:authorize="hasAuthority('ADMIN')" th:href="@{http://localhost:5174(ruolo='ADMIN', nome=${#authentication.name})}" class="nav-link-rym">Tutti i Libri</a>
        <a sec:authorize="isAuthenticated() and !hasAuthority('ADMIN')" th:href="@{http://localhost:5174(ruolo='USER', nome=${#authentication.name})}" class="nav-link-rym">Tutti i Libri</a>
        <a sec:authorize="isAnonymous()" href="http://localhost:5174" class="nav-link-rym">Tutti i Libri</a>
        
        <a href="/libri/cerca-emozione" class="nav-link-rym">Cerca per emozione</a>
    </div>
    <div class="d-flex align-items-center gap-2">
        <div sec:authorize="isAnonymous()">
            <a href="/login" class="nav-link-rym">Accedi</a>
            <a href="/register" class="nav-link-rym">Registrati</a>
        </div>
        <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-2">
            <a href="/area-personale" class="nav-link-rym">👤 <span sec:authentication="name"></span></a>
            <a sec:authorize="hasAuthority('ADMIN')" href="/admin" class="nav-link-rym">⚙️</a>
            <form action="/logout" method="post" class="m-0">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="user-btn-rym" title="Logout">⏻</button>
            </form>
        </div>
    </div>
</nav>
</body>
</html>
